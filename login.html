<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-card">
        <div class="login-header">
            <img src="img/logo.png" alt="MediPlus logo" class="login-logo">
            
        </div>

        <div id="errorMessage" style="color: #d9534f; background: #f2dede; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none;"></div>

        <form id="loginForm" action="process_login.php" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="actions">
                <button type="submit">Log In</button>
            </div>
        </form>

        <p class="forgot-password"><a href="reset_password.html">Forgot Password?</a></p>
    </main>

    <script src="login.js"></script>
</body>
</html>
